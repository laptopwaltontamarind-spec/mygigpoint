<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Earn Money WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #f3f4f6; padding-bottom: 80px; overflow-x: hidden; touch-action: pan-y; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }
        .card { background: #161f30; padding: 18px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #0088cc, #005580); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 15px; letter-spacing: 0.5px; transition: all 0.3s ease; }
        .btn-danger { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        
        .error-msg-box {
            display: none;
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.12);
            border: 1px solid #ff4d4d;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 14px;
            text-align: center;
            font-weight: 600;
        }

        input, button, select, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        input { width: 100%; padding: 12px 16px; margin: 8px 0 14px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: #fff; font-size: 15px; outline: none; transition: all 0.3s ease; }
        input:focus { border-color: #ffd700; box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); background: rgba(255, 255, 255, 0.08); }
        label { font-size: 13px; color: #9ca3af; font-weight: 600; }

        /* Navbar Layout */
        .navbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(18, 25, 38, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 10px 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); max-width: 480px; margin: 0 auto; z-index: 999; }
        .nav-item { border: none; background: none; font-size: 13px; color: #9ca3af; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 8px 12px; border-radius: 10px; display: flex; align-items: center; gap: 4px; }
        .nav-item.active { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.4); background: rgba(255, 215, 0, 0.08); }

        /* Dropdown/Popup Menu CSS */
        .menu-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu-content {
            display: none;
            position: absolute;
            bottom: 55px;
            right: 0;
            background: #161f30;
            min-width: 160px;
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            z-index: 1000;
            overflow: hidden;
            backdrop-filter: blur(15px);
        }

        .dropdown-menu-content button {
            color: #f3f4f6;
            padding: 12px 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dropdown-menu-content button:last-child {
            border-bottom: none;
        }

        .dropdown-menu-content button:active {
            background-color: rgba(255, 215, 0, 0.15);
            color: #ffd700;
        }

        .dropdown-menu-content.show {
            display: block;
        }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .table-custom { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; color: #d1d5db; }
        .table-custom th, .table-custom td { border: 1px solid rgba(255,255,255,0.08); padding: 10px; text-align: left; }
        .table-custom th { background: rgba(255, 255, 255, 0.05); color: #ffd700; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .bg-pending { background: #ffc107; color: #000; }
        .bg-approved { background: #28a745; color: #fff; }
        .bg-rejected { background: #dc3545; color: #fff; }

        .luxury-profile-card {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .luxury-profile-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, rgba(255,215,0,0) 70%);
            border-radius: 50%;
        }

        .profile-header { display: flex; align-items: center; gap: 15px; }

        .avatar-box {
            width: 55px;
            height: 55px;
            background: linear-gradient(45deg, #ffd700, #ffa500);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .user-info h3 { font-size: 20px; font-weight: 700; color: #ffffff; }

        .status-badge-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            margin-top: 5px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background-color: #28a745;
            border-radius: 50%;
            box-shadow: 0 0 8px #28a745;
        }

        .status-text { font-size: 13px; font-weight: 600; color: #e5e7eb; }

        .expire-badge {
            margin-top: 12px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }

        .luxury-stat-box {
            background: #1e293b;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-icon { font-size: 28px; background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 12px; }
        .stat-data h4 { font-size: 12px; color: #9ca3af; text-transform: uppercase; }
        .stat-data p { font-size: 20px; font-weight: 800; color: #ffffff; }

        .luxury-ref-card {
            background: linear-gradient(135deg, #111827, #1f2937);
            color: #fff;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .ref-header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .ref-code-box { background: rgba(255, 255, 255, 0.05); border: 1px dashed #ffd700; padding: 12px; border-radius: 10px; margin: 8px 0; }
        .ref-code-box p { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #ffd700; }
        .ref-subtext { font-size: 12px; color: #9ca3af; }

        .luxury-logout-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            box-shadow: 0 4px 12px rgba(255, 75, 43, 0.3);
            margin-top: 15px;
        }

        .luxury-job-card {
            background: linear-gradient(145deg, #0f172a, #1e1b4b);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .luxury-job-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .job-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .job-badge-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .job-live-indicator {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #4ade80;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: pulse-glow 2s infinite;
        }

        .job-live-dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .job-reward-banner {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .reward-info-left small {
            display: block;
            color: #9ca3af;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .reward-info-left span {
            font-size: 22px;
            font-weight: 900;
